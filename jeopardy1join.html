<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2c0a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jeopardy Buzzer</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--blue:#57198a;--deep:#2c0a4a;--night:#13041f;--gold:#ffcc4d;--me:#888}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--night);color:#fff;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
.view{display:none;min-height:100%;min-height:100dvh}
.view.on{display:flex}
.logo{font-family:Anton,Impact,sans-serif;font-size:56px;letter-spacing:.02em;text-shadow:3px 3px 0 #000;line-height:1}

/* waiting for the host */
#wait{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,#7a2bb8 0%,var(--deep) 60%,var(--night) 100%)}
#wait p{opacity:.8;font-size:18px;line-height:1.4;max-width:300px}
.dots::after{content:'';animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* join form */
#join{flex-direction:column;padding:max(20px,env(safe-area-inset-top)) 18px 28px;background:linear-gradient(var(--deep),var(--night));align-items:center}
#join form{width:100%;max-width:440px}
#join .logo{font-size:44px;text-align:center;margin:8px 0 18px}
label.l{display:block;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;opacity:.7;font-weight:700;margin:18px 0 8px}
#name{width:100%;padding:15px 16px;border-radius:14px;border:0;background:#fff;color:#000;font-size:20px;font-weight:600;-webkit-user-select:text;user-select:text}
#colors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{aspect-ratio:4/3;border-radius:18px;background:var(--c);position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:11px;font-weight:700;box-shadow:inset 0 -6px 12px rgba(0,0,0,.18)}
.sw.sel{outline:4px solid #fff;outline-offset:3px}
.sw.sel::after{content:'✓';position:absolute;top:50%;left:50%;transform:translate(-50%,-62%);font-size:30px;font-weight:900}
.sw.light{color:#111}
.sw[disabled]{background:#22103a;box-shadow:inset 0 0 0 3px var(--c);color:#fff;cursor:not-allowed}
.sw span{display:block;max-width:100%;padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw.custom{background:conic-gradient(from 90deg,#ff3b30,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff2d55,#ff3b30);cursor:pointer;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7);font-size:13px}
.sw.custom.picked{background:var(--c)}
.sw.custom.picked.light{color:#111;text-shadow:none}
.sw.custom input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0}
#go{width:100%;margin-top:26px;padding:17px;border-radius:14px;background:var(--gold);color:#1a1300;font-weight:900;font-size:19px}
#go:disabled{opacity:.5}
#joinErr{color:#ffb4b4;min-height:1.4em;margin-top:12px;text-align:center}

/* buzzer */
#play{flex-direction:column;background:var(--night)}
#top{display:flex;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:var(--me);color:var(--meText,#fff)}
#top .nm{font-weight:800;font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#top .sc{font-family:Anton,Impact,sans-serif;font-size:28px}
#edit{background:rgba(0,0,0,.18);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:18px}
#status{font-size:20px;font-weight:700;text-align:center;min-height:2.6em;display:flex;align-items:center;max-width:340px;line-height:1.3}
#btn{width:min(78vw,52vh,380px);aspect-ratio:1;border-radius:50%;font-family:Anton,Impact,sans-serif;font-size:min(15vw,64px);letter-spacing:.03em;color:#fff;background:#4a3d5c;box-shadow:0 14px 0 #2a2036,0 18px 30px rgba(0,0,0,.5);transition:background .12s;touch-action:none}
#btn:active,#btn.press{transform:translateY(8px);box-shadow:0 6px 0 #2a2036,0 8px 18px rgba(0,0,0,.5)}
#btn.ready{background:#c98a00;box-shadow:0 14px 0 #7a5400,0 18px 30px rgba(0,0,0,.5)}
#btn.go{background:#e0182d;box-shadow:0 14px 0 #8a0a17,0 0 60px rgba(255,40,60,.65);animation:pulse 1s ease-in-out infinite}
#btn.mine{background:#14a44d;box-shadow:0 14px 0 #0a5f2b,0 0 60px rgba(40,255,120,.5);animation:none}
#btn.dim{background:#2c2238;color:rgba(255,255,255,.35);box-shadow:0 14px 0 #1a1224}
#btn.early{background:#6b2a2a}
@keyframes pulse{50%{box-shadow:0 14px 0 #8a0a17,0 0 90px rgba(255,40,60,.9)}}
#sub{font-size:15px;opacity:.65;text-align:center;min-height:1.3em;max-width:340px}
/* where on campus: tap the map */
#pinStage{display:none;flex:1;min-height:0;flex-direction:column;gap:8px;padding:10px 12px max(12px,env(safe-area-inset-bottom))}
#play.pinning #stage{display:none}
#play.pinning #pinStage{display:flex}
#play.pinning{height:100vh;height:100dvh}
#pinMsg{font-size:19px;font-weight:800;text-align:center;line-height:1.25;min-height:1.25em}
#pinBar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
#pinBar i{display:block;height:100%;width:100%;background:var(--gold);border-radius:99px;transform-origin:left}
#pinBar.low i{background:#e0182d}
#pinWrap{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding-top:4px}
#pinMap{position:relative;flex:none;border-radius:12px;overflow:hidden;touch-action:none;box-shadow:0 0 0 2px var(--gold)}
#pinMap img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
#pinVeil{position:absolute;inset:0;background:rgba(19,4,31,.7);display:none;align-items:center;justify-content:center;text-align:center;font-family:Anton,Impact,sans-serif;font-size:34px;line-height:1.15;padding:20px;text-shadow:2px 2px 0 #000}
#pinVeil.on{display:flex}
#pinSub{font-size:15px;opacity:.75;text-align:center;min-height:1.3em}
.pinLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pinLines line{stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-dasharray:5 4}
.mk{position:absolute;width:0;height:0}
.mk b{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px #fff,0 2px 4px rgba(0,0,0,.6)}
.mk span{position:absolute;left:11px;top:-11px;white-space:nowrap;font-size:12px;font-weight:700;background:rgba(0,0,0,.65);padding:1px 5px;border-radius:4px;border-left:3px solid var(--c)}
.mk.real{z-index:2}
.mk.real b{left:-14px;top:-14px;width:28px;height:28px;background:var(--gold);box-shadow:0 0 0 3px #000,0 0 14px var(--gold);display:flex;align-items:center;justify-content:center;font-size:17px;color:#000}
.mk.real b::before{content:'★'}
.mk.real span{display:none}
/* my own pin: the tip is the spot, the head sits above my finger */
#pinMine{display:none;position:absolute;width:0;height:0;z-index:3}
#pinMine.on{display:block}
#pinMine svg{position:absolute;left:-17px;top:-46px;width:34px;height:46px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.6))}
#conn{position:fixed;top:env(safe-area-inset-top);left:0;right:0;text-align:center;background:#b00020;font-size:14px;padding:5px;display:none;z-index:9}
</style>
</head>
<body>

<section class="view" id="wait">
  <div class="logo">JEOPARDY!</div>
  <p id="waitMsg"><span class="dots">Waiting for the host to start the game</span><br><br>Keep this page open &mdash; it will continue on its own.</p>
</section>

<section class="view" id="join">
  <form id="joinForm" autocomplete="off">
    <div class="logo">JEOPARDY!</div>
    <label class="l" for="name">Your name</label>
    <input id="name" maxlength="16" placeholder="Name" autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <label class="l">Pick your color</label>
    <div id="colors"></div>
    <button id="go" type="submit">Join the game</button>
    <div id="joinErr"></div>
  </form>
</section>

<section class="view" id="play">
  <div id="top"><button id="edit" type="button">Edit</button><div class="nm"></div><div class="sc"></div></div>
  <div id="stage">
    <div id="status"></div>
    <button id="btn" type="button">BUZZ</button>
    <div id="sub"></div>
  </div>
  <div id="pinStage">
    <div id="pinMsg"></div>
    <div id="pinBar"><i></i></div>
    <div id="pinSub"></div>
    <div id="pinWrap">
      <div id="pinMap">
        <img src="/jeopardy1-campus.jpg" alt="Campus map" draggable="false">
        <svg class="pinLines" viewBox="0 0 1 1" preserveAspectRatio="none"></svg>
        <div class="pins"></div>
        <div id="pinMine"><svg viewBox="0 0 34 46"><path d="M17 45C17 45 2 27 2 16.5a15 15 0 0 1 30 0C32 27 17 45 17 45z" fill="var(--me)" stroke="#fff" stroke-width="2.5"/><circle cx="17" cy="16" r="5.5" fill="#fff"/></svg></div>
        <div id="pinVeil"></div>
      </div>
    </div>
  </div>
</section>

<div id="conn">Reconnecting&hellip;</div>

<script src="/jeopardy1-clock.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const money = (n) => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString();
  const isLight = (hex) => { const h = hex.replace('#', ''); const [r, g, b] = [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); return (r * 299 + g * 587 + b * 114) / 1000 > 165; };
  const KEY = 'jeopardy1.me';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } };
  const save = (v) => { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} };
  let me = load();               // { id, game, n, name, color }
  const isHex = (c) => /^#[0-9a-f]{6}$/i.test(c || '');
  let S = null, editing = false, pickedColor = isHex(me.color) ? me.color : null, fails = 0;
  let flash = null;              // { text, cls, until } short-lived message from my own buzz
  let myBuzz = null;             // attempt I know I won (before the next poll confirms it)
  const serverNow = () => JClock.now() - 50;   // run a little behind: never show BUZZ! before the server will take it
  const post = (action, body) => fetch('/api/jeopardy/' + action, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
    .then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j; });

  function show(id) { document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === id)); }
  const colorHex = (c) => (isHex(c) ? c : '#888');

  // ---------------------------------------------------------------- join form
  function drawColors() {
    const taken = {};
    S.players.forEach((p) => { if (p.n !== mine()?.n) taken[p.color] = p.name; });
    if (pickedColor && taken[pickedColor]) pickedColor = null;
    // built once, then updated in place: rebuilding would close the color picker while someone is using it
    if (!$('#customSw')) {
      $('#colors').innerHTML = S.colors.map((c) => `<button type="button" class="sw" style="--c:${c.hex}" data-c="${c.hex}" aria-label="${c.name}"><span></span></button>`).join('')
        + '<label class="sw custom" id="customSw"><input type="color" id="customIn" value="#7a2bb8" aria-label="Custom color"><span>Custom</span></label>';
    }
    document.querySelectorAll('#colors button.sw').forEach((b) => {
      const hex = b.dataset.c;
      b.disabled = !!taken[hex];
      b.classList.toggle('sel', hex === pickedColor);
      b.classList.toggle('light', isLight(hex));
      b.querySelector('span').textContent = taken[hex] || '';
    });
    const custom = !!pickedColor && !S.colors.some((c) => c.hex === pickedColor);
    const cs = $('#customSw');
    cs.classList.toggle('sel', custom);
    cs.classList.toggle('picked', custom);
    cs.classList.toggle('light', custom && isLight(pickedColor));
    if (custom) { cs.style.setProperty('--c', pickedColor); $('#customIn').value = pickedColor; }
  }
  const pickCustom = (e) => { if (e.target.id === 'customIn') { pickedColor = e.target.value.toLowerCase(); drawColors(); } };
  $('#colors').addEventListener('input', pickCustom);
  $('#colors').addEventListener('change', pickCustom);
  $('#colors').addEventListener('click', (e) => {
    const b = e.target.closest('.sw');
    if (!b || b.disabled || b.id === 'customSw') return;
    pickedColor = b.dataset.c;
    drawColors();
  });
  $('#joinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('#name').value.trim();
    $('#joinErr').textContent = '';
    if (!name) { $('#joinErr').textContent = 'Type your name first.'; return; }
    if (!pickedColor) { $('#joinErr').textContent = 'Pick a color.'; return; }
    $('#go').disabled = true;
    try {
      const r = await post('join', { id: me.id, game: me.game, name, color: pickedColor });
      me = r; save(me); editing = false;
      wakeLock();
      render();
    } catch (err) { $('#joinErr').textContent = err.message; poll(true); }
    $('#go').disabled = false;
  });
  $('#edit').addEventListener('click', () => {
    editing = true; $('#name').value = me.name || ''; pickedColor = me.color; $('#go').textContent = 'Save'; render();
  });

  // am I in the current game?
  function mine() {
    if (!S || !me.id || me.game !== S.game) return null;
    return S.players.find((p) => p.n === me.n) || null;
  }

  // ---------------------------------------------------------------- buzzer
  // what the button should look like right now
  function buttonState() {
    const p = mine(), q = S.q;
    if (flash && Date.now() < flash.until) return flash;
    if (S.phase === 'question' && q) {
      const attempt = q.attempt;
      if (q.buzz) {
        if (q.buzz.n === p.n || myBuzz === attempt) return { cls: 'mine', label: 'YOU!', status: 'You buzzed in first!', sub: 'Say your answer out loud.' };
        const who = S.players.find((x) => x.n === q.buzz.n);
        return { cls: 'dim', label: 'BUZZ', status: (who ? who.name : 'Someone') + ' buzzed in', sub: 'Wait — they might get it wrong.' };
      }
      if (myBuzz === attempt) return { cls: 'mine', label: 'YOU!', status: 'You buzzed in first!', sub: 'Say your answer out loud.' };
      if (q.only != null && q.only !== p.n) {
        const who = S.players.find((x) => x.n === q.only);
        return { cls: 'dim', label: 'BUZZ', status: 'Daily Double', sub: (who ? who.name : 'Someone') + ' is playing this one.' };
      }
      if (q.locked.includes(p.n)) return { cls: 'dim', label: 'OUT', status: 'You’re out on this one', sub: 'You already answered this clue.' };
      if (serverNow() < q.openAt) return { cls: 'ready', label: 'WAIT', status: 'Read the clue…', sub: 'Buzzing early locks you out for a second.' };
      return { cls: 'go', label: 'BUZZ!', status: q.only != null ? 'Daily Double — buzz when ready' : 'Buzzers are open!', sub: '' };
    }
    if (S.phase === 'reveal' && S.rev) {
      const r = S.rev;
      if (r.winner === p.n) return { cls: 'mine', label: '+' + money(r.delta).slice(1), status: 'Correct!', sub: 'The answer was ' + r.answer };
      return { cls: 'dim', label: 'BUZZ', status: r.winner == null ? 'Nobody got it' : ((S.players.find((x) => x.n === r.winner) || {}).name || 'Someone') + ' got it', sub: 'The answer was ' + r.answer };
    }
    if (S.phase === 'dd') return { cls: 'dim', label: 'BUZZ', status: 'Daily Double!', sub: 'Waiting for the wager…' };
    if (S.phase === 'final') {
      const rank = [...S.players].sort((a, b) => b.score - a.score).findIndex((x) => x.n === p.n) + 1;
      return { cls: rank === 1 ? 'mine' : 'dim', label: '#' + rank, status: 'Game over!', sub: rank === 1 ? 'You won!' : 'Thanks for playing.' };
    }
    if (S.phase === 'lobby') return { cls: 'dim', label: 'BUZZ', status: 'You’re in!', sub: 'Waiting for the host to start the board.' };
    return { cls: 'dim', label: 'BUZZ', status: 'Watch the TV', sub: 'Buzz as soon as the clue shows up. Buzzing before that locks you out for a second.' };
  }

  function drawTop() {
    const p = mine();
    const hex = colorHex(p.color);
    document.documentElement.style.setProperty('--me', hex);
    document.documentElement.style.setProperty('--meText', isLight(hex) ? '#111' : '#fff');
    $('#top .nm').textContent = p.name;
    $('#top .sc').textContent = money(p.score);
  }

  let lastDrawn = '';
  function drawPlay() {
    drawTop();
    const b = buttonState();
    const key = b.cls + b.label + b.status + b.sub;
    if (key === lastDrawn) return;
    lastDrawn = key;
    $('#btn').className = b.cls; $('#btn').textContent = b.label;
    $('#status').textContent = b.status; $('#sub').textContent = b.sub;
  }

  let lastTap = 0;
  async function tap(e) {
    e.preventDefault();
    if (!mine()) return;
    const t = Date.now();
    if (t - lastTap < 150) return;
    lastTap = t;
    $('#btn').classList.add('press');
    setTimeout(() => $('#btn').classList.remove('press'), 120);
    if (navigator.vibrate) navigator.vibrate(30);
    try {
      const r = await post('buzz', { id: me.id });
      if (r.result === 'first') { myBuzz = r.attempt != null ? r.attempt : (S.q && S.q.attempt); poll(true); }
      else if (r.result === 'early') flash = { cls: 'early', label: 'TOO SOON', status: 'Too early!', sub: 'Locked out for a second.', until: Date.now() + (r.lockMs || 1000) };
      else if (r.result === 'early_lock') flash = { cls: 'early', label: 'WAIT', status: 'Still locked out…', sub: 'You buzzed too early.', until: Date.now() + 500 };
      else if (r.result === 'beaten') poll(true);
      else if (r.result === 'not_joined') { me = {}; save(me); }
      drawPlay();
    } catch (err) {}
  }
  $('#btn').addEventListener('pointerdown', tap);

  // ---------------------------------------------------------------- where on campus
  const MAP_RATIO = 1200 / 1317;   // jeopardy1-campus.jpg
  const feet = (m) => Math.round(m * 3.28084).toLocaleString() + ' ft';
  const pct = (v) => (v * 100).toFixed(2) + '%';
  const pinMode = () => S && (S.phase === 'pin' || (S.phase === 'reveal' && S.rev && S.rev.kind === 'pin'));
  let myPin = null;          // { attempt, x, y } where I put it
  let pinSent = '', pinBusy = false, dragging = false;

  function sizeMap() {
    const w = $('#pinWrap'), m = $('#pinMap');
    if (!w.clientHeight) return;
    const width = Math.min(w.clientWidth, w.clientHeight * MAP_RATIO);
    m.style.width = width + 'px';
    m.style.height = width / MAP_RATIO + 'px';
  }
  window.addEventListener('resize', sizeMap);

  const pinOpen = () => S && S.phase === 'pin' && serverNow() >= S.q.openAt - 150 && serverNow() < S.q.closeAt;

  // one request at a time; whatever the pin is when it lands goes next
  async function sendPin() {
    if (pinBusy || !myPin || !S || S.phase !== 'pin' || myPin.attempt !== S.q.attempt) return;
    const key = myPin.attempt + ':' + myPin.x + ',' + myPin.y;
    if (key === pinSent) return;
    pinBusy = true;
    try {
      const r = await post('pin', { id: me.id, x: myPin.x, y: myPin.y });
      if (r.result === 'ok') pinSent = key;
      else if (r.result === 'not_joined') { me = {}; save(me); }
    } catch (e) {}
    pinBusy = false;
    if (myPin && myPin.attempt + ':' + myPin.x + ',' + myPin.y !== pinSent && pinOpen()) sendPin();
  }

  function pinAt(e) {
    const r = $('#pinMap').getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
    myPin = { attempt: S.q.attempt, x: Math.round(x * 10000) / 10000, y: Math.round(y * 10000) / 10000 };
    drawPin();
  }
  $('#pinMap').addEventListener('pointerdown', (e) => {
    if (!pinOpen()) return;
    e.preventDefault();
    dragging = true;
    try { $('#pinMap').setPointerCapture(e.pointerId); } catch (err) {}
    if (navigator.vibrate) navigator.vibrate(15);
    pinAt(e); sendPin();
  });
  $('#pinMap').addEventListener('pointermove', (e) => { if (dragging && pinOpen()) { pinAt(e); sendPin(); } });
  const drop = () => { if (dragging) { dragging = false; sendPin(); } };
  $('#pinMap').addEventListener('pointerup', drop);
  $('#pinMap').addEventListener('pointercancel', drop);

  function drawPin() {
    drawTop();
    sizeMap();
    const p = mine(), veil = $('#pinVeil'), bar = $('#pinBar');
    let msg = '', sub = '', veilText = '';
    if (S.phase === 'pin') {
      const q = S.q, t = serverNow();
      if (myPin && myPin.attempt !== q.attempt) myPin = null;
      if ($('#pinMap').dataset.drawn) { delete $('#pinMap').dataset.drawn; $('#pinMap .pins').innerHTML = ''; $('#pinMap .pinLines').innerHTML = ''; }
      if (t < q.openAt) { msg = 'Look at the photo on the TV!'; veilText = 'Get ready…'; bar.firstChild.style.transform = 'scaleX(1)'; }
      else if (t < q.closeAt) {
        const left = q.closeAt - t;
        msg = myPin ? 'Drag your pin to fix it' : 'Tap where this photo was taken';
        sub = Math.ceil(left / 1000) + (Math.ceil(left / 1000) === 1 ? ' second left' : ' seconds left');
        bar.firstChild.style.transform = 'scaleX(' + (left / (q.closeAt - q.openAt)).toFixed(3) + ')';
        bar.classList.toggle('low', left < 3000);
      } else {
        msg = myPin ? 'Pin locked in' : 'You didn’t drop a pin';
        veilText = 'Time’s up!';
        bar.firstChild.style.transform = 'scaleX(0)';
        sub = 'Watch the TV for the answer';
      }
      $('#pinMine').classList.toggle('on', !!myPin);
      if (myPin) { $('#pinMine').style.left = pct(myPin.x); $('#pinMine').style.top = pct(myPin.y); }
      bar.style.visibility = '';
    } else {
      // results: everyone's pin and the real spot
      const r = S.rev;
      const key = 'rev' + r.c + ':' + r.r + ':' + S.v;
      if ($('#pinMap').dataset.drawn !== key) {
        $('#pinMap').dataset.drawn = key;
        let html = '', lines = '';
        r.guesses.forEach((g) => {
          const pl = S.players.find((x) => x.n === g.n);
          if (!pl) return;
          const hex = colorHex(pl.color);
          html += `<div class="mk" style="left:${pct(g.x)};top:${pct(g.y)};--c:${hex}"><b></b><span></span></div>`;
          lines += `<line x1="${g.x}" y1="${g.y}" x2="${r.pin.x}" y2="${r.pin.y}" stroke="${hex}"></line>`;
        });
        html += `<div class="mk real" style="left:${pct(r.pin.x)};top:${pct(r.pin.y)}"><b></b></div>`;
        $('#pinMap .pins').innerHTML = html;
        $('#pinMap .pinLines').innerHTML = lines;
        $('#pinMap .pins').querySelectorAll('.mk:not(.real) span').forEach((el, i) => { const pl = S.players.find((x) => x.n === r.guesses[i].n); el.textContent = pl ? pl.name : ''; });
      }
      $('#pinMine').classList.remove('on');
      bar.style.visibility = 'hidden';
      const mineG = r.guesses.find((g) => g.n === p.n);
      if (r.winners.includes(p.n)) { msg = 'Closest! +' + money(r.delta).slice(1); sub = 'You were ' + feet(mineG.d) + ' away'; }
      else if (mineG) {
        const w = S.players.find((x) => x.n === r.winners[0]);
        msg = 'You were ' + feet(mineG.d) + ' away';
        sub = (w ? w.name : 'Someone') + ' was closest (' + feet(r.guesses[0].d) + ')';
      } else { msg = 'No pin this time'; sub = r.winners.length ? ((S.players.find((x) => x.n === r.winners[0]) || {}).name || 'Someone') + ' was closest' : ''; }
      if (r.answer) sub = r.answer + (sub ? ' · ' + sub : '');
    }
    $('#pinMsg').textContent = msg;
    $('#pinSub').textContent = sub;
    veil.textContent = veilText;
    veil.classList.toggle('on', !!veilText);
  }
  $('#btn').addEventListener('contextmenu', (e) => e.preventDefault());

  // keep the screen on while playing
  let lock = null;
  async function wakeLock() { try { if (navigator.wakeLock && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wakeLock(); poll(true); } });
  document.addEventListener('pointerdown', wakeLock, { once: true });

  // ---------------------------------------------------------------- main
  function render() {
    if (!S) return;
    if (!S.game || S.phase === 'off') { editing = false; return show('wait'); }
    const p = mine();
    if (!p || editing) {
      if (!editing && !$('#name').value && me.name) $('#name').value = me.name;
      if (!p) $('#go').textContent = 'Join the game';
      drawColors();
      return show('join');
    }
    show('play');
    const pm = pinMode();
    $('#play').classList.toggle('pinning', !!pm);
    if (pm) drawPin(); else drawPlay();
  }

  let timer = null, inflight = false;
  async function poll(now) {
    if (now) { clearTimeout(timer); }
    if (inflight) return;
    inflight = true;
    try {
      const r = await fetch('/api/jeopardy/state' + (now ? '?live=1' : ''), { cache: 'no-store' });
      if (!r.ok) throw new Error(r.status);
      const s = await r.json();
      if (!S || s.v >= S.v || s.game !== S.game) S = s;
      if (S.q && myBuzz != null && S.q.attempt !== myBuzz) myBuzz = null;
      if (S.phase !== 'question') myBuzz = null;
      fails = 0; $('#conn').style.display = 'none';
      render();
    } catch (e) {
      if (++fails > 4) $('#conn').style.display = 'block';
    }
    inflight = false;
    clearTimeout(timer);
    timer = setTimeout(poll, 500);
  }
  poll(true);
  setInterval(() => {
    if (!S || !mine() || editing) return;
    if (pinMode()) { drawPin(); if (!dragging && pinOpen()) sendPin(); } else drawPlay();
  }, 100);
})();
</script>
</body>
</html>
